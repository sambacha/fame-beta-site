name: CI

# Quality gates on every PR and every push to main. Deployment workflows
# re-run this exact sequence — nothing ships without passing it first.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Lint · typecheck · build · verify · smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node (verification scripts)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint — ESLint + Biome, strict
        run: bun run lint

      - name: Typecheck — no escape hatches
        run: bun run typecheck

      - name: Static export build
        run: bun run build

      - name: Verify compiled artifacts
        run: node scripts/verify-artifacts.mjs --root out

      - name: Smoke tests
        run: node scripts/smoke.mjs --root out
