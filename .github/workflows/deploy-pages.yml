name: Deploy to GitHub Pages

# Ships the static SPA to the GitHub Pages project site
# (https://<owner>.github.io/<repo>/) by publishing the verified `dist/` tree
# to the `gh-pages` branch with the `gh-pages` npm package — the same script
# developers run locally as `bun run deploy:pages`. Every quality gate runs
# first: lint → typecheck → build → artifact verification → smoke tests.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "Deploy from a branch" → branch `gh-pages`, folder `/ (root)`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  SITE_URL: https://sambacha.github.io/fame-beta-site
  BASE_PATH: /fame-beta-site

jobs:
  deploy:
    name: Gates → gh-pages publish
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    steps:
      - name: Check out repository (persist credentials for the push)
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node (verification scripts + gh-pages)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Gates + publish (gh-pages package, same as bun run deploy:pages)
        run: node scripts/deploy-pages.mjs
        env:
          VITE_SITE_URL: ${{ env.SITE_URL }}
          VITE_BASE_PATH: ${{ env.BASE_PATH }}

      - name: Record deployment URL
        id: url
        run: echo "url=${SITE_URL}/" >> "$GITHUB_OUTPUT"

  post-deploy-smoke:
    name: Post-deploy smoke (live URL)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out verification scripts
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Smoke the live deployment
        run: node scripts/smoke.mjs --url "${{ needs.deploy.outputs.url }}" --retries 8 --retry-delay-ms 15000
