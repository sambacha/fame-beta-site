<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>spike</title>
<script type="importmap">
{"imports":{
 "preact":"https://esm.sh/preact@11.1.1",
 "preact/hooks":"https://esm.sh/preact@11.1.1/hooks",
 "htm":"https://esm.sh/htm@3.1.1",
 "react":"https://esm.sh/preact@11.1.1/compat",
 "react/jsx-runtime":"https://esm.sh/preact@11.1.1/compat/jsx-runtime",
 "react-dom":"https://esm.sh/preact@11.1.1/compat",
 "@base-ui/react/dialog":"https://esm.sh/@base-ui/react@1.9.0/dialog?external=react,react-dom",
 "@base-ui/react/tabs":"https://esm.sh/@base-ui/react@1.9.0/tabs?external=react,react-dom",
 "@base-ui/react/tooltip":"https://esm.sh/@base-ui/react@1.9.0/tooltip?external=react,react-dom",
 "@base-ui/react/switch":"https://esm.sh/@base-ui/react@1.9.0/switch?external=react,react-dom",
 "@base-ui/react/field":"https://esm.sh/@base-ui/react@1.9.0/field?external=react,react-dom"
}}
</script>
<style>
body{background:#111;color:#eee;font:14px sans-serif;padding:24px}
.tabs{display:flex;gap:4px;border-bottom:1px solid #444}
.tabs button{padding:12px 16px;background:none;border:0;color:#999;cursor:pointer}
.tabs button[data-active]{color:#2dd4a0;box-shadow:inset 0 -2px 0 #2dd4a0}
.sw{width:40px;height:24px;border-radius:99px;background:#444;position:relative;display:inline-block}
.sw[data-checked]{background:#2dd4a0}
.sw .thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw[data-checked] .thumb{left:19px}
.btn{padding:10px 16px;background:#333;color:#eee;border:1px solid #555;border-radius:3px;cursor:pointer}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.6)}
.pop{position:fixed;inset:0;margin:auto;width:320px;height:max-content;background:#1b1b1b;border:1px solid #555;border-radius:6px;padding:20px}
.tt{background:#333;padding:6px 10px;border-radius:3px}
.tipp{background:#2dd4a0;color:#111;padding:6px 10px;border-radius:3px}
input{background:#222;color:#eee;border:1px solid #555;padding:8px}
</style>
</head>
<body>
<div id="app"><p>Loading spike…</p></div>
<script type="module">
import {h,render} from 'preact';
import {useState} from 'preact/hooks';
import htm from 'htm';
import {Dialog} from '@base-ui/react/dialog';
import {Tabs} from '@base-ui/react/tabs';
import {Tooltip} from '@base-ui/react/tooltip';
import {Switch} from '@base-ui/react/switch';
import {Field} from '@base-ui/react/field';
const html = htm.bind(h);
window.SPIKE = {Dialog, Tabs, Tooltip, Switch, Field, status:'loaded'};
function App(){
  const [sw,setSw]=useState(false);
  return html`<div>
    <h2>Base UI + Preact spike</h2>
    <${Tabs.Root} defaultValue="a">
      <${Tabs.List} class="tabs" aria-label="Demo">
        <${Tabs.Tab} value="a">Tab A<//>
        <${Tabs.Tab} value="b">Tab B<//>
      <//>
      <${Tabs.Panel} value="a"><p id="panel-a">Panel A content</p><//>
      <${Tabs.Panel} value="b"><p id="panel-b">Panel B content</p><//>
    <//>
    <p>
      <${Switch.Root} id="sw" checked=${sw} onCheckedChange=${v=>setSw(!!v)} class="sw"><${Switch.Thumb}/><//>
      <span id="swstate">switch=${String(sw)}</span>
    </p>
    <p>
      <${Tooltip.Provider}>
        <${Tooltip.Root}>
          <${Tooltip.Trigger} class="tt" aria-label="Hover me">Hover me<//>
          <${Tooltip.Portal}><${Tooltip.Positioner} sideOffset=${8}><${Tooltip.Popup} class="tipp">Tooltip works<//><//><//>
        <//>
      <//>
    </p>
    <${Dialog.Root}>
      <${Dialog.Trigger} class="btn">Open dialog<//>
      <${Dialog.Portal}>
        <${Dialog.Backdrop} class="bd"/>
        <${Dialog.Popup} class="pop">
          <${Dialog.Title}>Dialog title<//>
          <${Dialog.Description}>Dialog description<//>
          <${Field.Root} validationMode="onBlur" validate=${v=>String(v).includes('x')?'No letter x allowed':undefined}>
            <${Field.Label}>Email</${Field.Label}>
            <${Field.Control} name="email" type="email" placeholder="you@x.io"/>
            <${Field.Error} style=${{color:'#f87171'}}>Invalid<//>
          <//>
          <p><${Dialog.Close} class="btn">Close<//></p>
        <//>
      <//>
    <//>
  </div>`;
}
render(html`<${App}/>`, document.getElementById('app'));
document.title='spike-ready';
</script>
</body>
</html>
